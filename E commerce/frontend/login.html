<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-4" style="width:400px">

<h3 class="text-center mb-4">Login</h3>

<input id="loginEmail" class="form-control mb-3" placeholder="Email">

<input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password">

<button onclick="login()" class="btn btn-primary w-100">
Login
</button>

<p class="text-center mt-3 mb-0">
Don't have an account?
</p>

<a href="register.html" class="text-center d-block">
Register
</a>

</div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
