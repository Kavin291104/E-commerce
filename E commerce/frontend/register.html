<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-4" style="width:420px">

<h3 class="text-center mb-4">Create Account</h3>

<input id="regName" class="form-control mb-3" placeholder="Full Name">

<input id="regEmail" class="form-control mb-3" placeholder="Email">

<input id="regPassword" type="password" class="form-control mb-3" placeholder="Password">

<button onclick="register()" class="btn btn-success w-100">
Register
</button>

<p class="text-center mt-3 mb-0">
Already have an account?
</p>

<a href="login.html" class="text-center d-block">
Login
</a>

</div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
