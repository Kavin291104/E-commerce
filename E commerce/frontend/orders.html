<!DOCTYPE html>
<html>

<head>

<title>Your Orders</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f5f5;
font-family:Arial,Helvetica,sans-serif;
}

.orders-container{
max-width:900px;
margin:40px auto;
padding:10px;
}

.order-card{

background:white;
border-radius:12px;
padding:20px;
margin-bottom:25px;

box-shadow:0 6px 15px rgba(0,0,0,0.08);

transition:0.2s;
}

.order-card:hover{
transform:translateY(-4px);
}

.order-top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:15px;
}

.order-id{
font-size:18px;
font-weight:600;
}

.order-date{
color:#777;
font-size:14px;
}

.status{

padding:6px 14px;

border-radius:20px;

font-size:13px;

font-weight:bold;

}

.processing{
background:#fff3cd;
color:#856404;
}

.products{

border-top:1px solid #eee;

padding-top:15px;

margin-top:10px;

}

.product{

display:flex;

align-items:center;

margin-bottom:12px;

}

.product img{

width:60px;

height:60px;

object-fit:cover;

border-radius:8px;

margin-right:15px;

}

.product-name{
font-weight:500;
}

.product-price{
color:#27ae60;
font-weight:bold;
}

</style>

</head>

<body>

<h1 style="text-align:center;margin-top:30px">Your Orders</h1>

<div class="orders-container" id="ordersContainer"></div>

<script src="js/orders.js"></script>

</body>

</html>
